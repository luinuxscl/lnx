name: base-image

# Publica la imagen base compartida por las apps lnx en GHCR.
# Se ejecuta a mano o cuando cambia su Dockerfile. Las apps la consumen con
# `FROM ghcr.io/luinuxscl/lnx-php:8.5`.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/base/Dockerfile
      - .github/workflows/base-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/base
          push: true
          tags: ghcr.io/luinuxscl/lnx-php:8.5
          cache-from: type=gha,scope=lnx-php-8.5
          cache-to: type=gha,mode=max,scope=lnx-php-8.5
          provenance: false