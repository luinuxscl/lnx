name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Configure lnx-ui deploy key
        env:
          LNX_UI_DEPLOY_KEY: ${{ secrets.LNX_UI_DEPLOY_KEY }}
        run: |
          if [ -z "$LNX_UI_DEPLOY_KEY" ]; then
            echo "LNX_UI_DEPLOY_KEY not set; skipping deploy key configuration."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$LNX_UI_DEPLOY_KEY" > ~/.ssh/lnx_ui
          chmod 600 ~/.ssh/lnx_ui
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/lnx_ui -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Setup Application
        run: composer setup

      - name: Check agent context
        run: |
          python3 scripts/test_check_agent_context.py
          python3 scripts/check-agent-context.py

      - name: Run CI Checks
        run: composer ci:check
