name: reusable-probe

# Workflow de prueba, temporal: valida que un repo privado del mismo dueño
# puede llamar a un workflow reusable de otro repo privado.

on:
  workflow_call:
    inputs:
      mensaje:
        required: false
        type: string
        default: 'probe reusable ok'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "${{ inputs.mensaje }}"