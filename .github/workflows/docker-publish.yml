name: docker-publish

# Workflow reusable: construye la imagen de una app lnx y la publica en GHCR.
# Pensado para que Coolify despliegue por "Docker Image" (solo pull), en vez de
# reconstruir la imagen en el VPS en cada version.
#
# Uso desde el repo de la app:
#
#   name: publish
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#     packages: write
#   jobs:
#     publish:
#       uses: luinuxscl/lnx/.github/workflows/docker-publish.yml@ci-v1
#       with:
#         image: luinuxscl/<app>
#         coolify_uuid: <uuid del recurso en Coolify>
#       secrets: inherit
#
# Secretos que consume (todos opcionales):
#   COMPOSER_AUTH  JSON {"github-oauth":{"github.com":"<token>"}} para bajar
#                  paquetes privados (modulo + lnx-ui) durante el build.
#   COOLIFY_TOKEN  token de la API de Coolify, para disparar el deploy.

on:
  workflow_call:
    inputs:
      image:
        description: 'Imagen en GHCR, sin registro (p. ej. luinuxscl/luz-app)'
        required: true
        type: string
      dockerfile:
        description: 'Ruta del Dockerfile dentro del repo'
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: 'Contexto de build'
        required: false
        type: string
        default: '.'
      coolify_url:
        description: 'Base URL de Coolify'
        required: false
        type: string
        default: 'https://vps.luinuxscl.com'
      coolify_uuid:
        description: 'UUID del recurso en Coolify; vacio = no dispara deploy'
        required: false
        type: string
        default: ''
      extra_build_args:
        description: 'Build args adicionales, uno por linea'
        required: false
        type: string
        default: ''
    secrets:
      COMPOSER_AUTH:
        required: false
      COOLIFY_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ inputs.image }}:${{ github.sha }}
            ghcr.io/${{ inputs.image }}:latest
          build-args: |
            COMPOSER_AUTH=${{ secrets.COMPOSER_AUTH }}
            ${{ inputs.extra_build_args }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
          provenance: false

      - name: Trigger Coolify deploy
        if: ${{ inputs.coolify_uuid != '' }}
        env:
          COOLIFY_URL: ${{ inputs.coolify_url }}
          COOLIFY_UUID: ${{ inputs.coolify_uuid }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_TOKEN no esta configurado; no puedo disparar el deploy."
            exit 1
          fi
          echo "Disparando deploy de $COOLIFY_UUID en $COOLIFY_URL"
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json"
          echo
          echo "Deploy disparado."